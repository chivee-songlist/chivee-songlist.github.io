<style>
:root{
  --paper:#F1EBFC; --sheet:#FFFFFF; --ink:#2C2550; --soft:#716A93; --line:#E4DCF5;
  --lilac:#B8A2E6; --lilac-d:#7B62C4; --butter:#FFF0A6; --butter-d:#E9C94A; --pink:#F6C5DA; --rose:#D9417F;
  --px:#5B4596;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);
  background-image:radial-gradient(1200px 420px at 50% -120px,#FFF6C9 0%,rgba(255,246,201,0) 70%),radial-gradient(900px 500px at 85% 0,#E6D9FF 0%,rgba(230,217,255,0) 70%)}
.wrap{max-width:640px;margin:0 auto;padding:30px 16px 90px;position:relative}
header{position:relative;padding-bottom:6px}
h1{font:400 clamp(46px,12vw,68px)/.95 var(--display);margin:0;letter-spacing:-.01em;color:var(--ink);
  text-shadow:0 2px 0 #fff,0 0 22px rgba(255,236,150,.9)}
h1 .note{color:var(--rose)}
.sub{color:var(--soft);margin:8px 0 0;font-size:14px}
.strip{position:relative;height:0;overflow:hidden}
body.narrow .strip{height:160px;margin-top:4px}

/* 오늘의 추천 */
.today{margin:18px 0 0;background:linear-gradient(100deg,#FFF7CF,#FFFDF3 55%,#F3EBFF);border:2px solid var(--butter-d);
  border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.today .lab{font:400 14px var(--display);color:#8A6A00;background:var(--butter);border-radius:8px;padding:4px 8px;white-space:nowrap}
.today .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.today .a{color:var(--soft);font-size:13px}
.today .grow{flex:1;min-width:0}
.btn{font:inherit;font-size:14px;border:0;border-radius:999px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.main{background:var(--ink);color:#fff}
.btn.lil{background:var(--lilac-d);color:#fff}
.btn:focus-visible,.chip:focus-visible,li button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

/* 검색·분류 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);padding:12px 0 10px;margin-top:10px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--lilac-d)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
.chip{font:500 14px/1 var(--body);padding:9px 13px;border-radius:999px;border:0;background:#E6DEF7;color:var(--ink);cursor:pointer}
.chip b{font-weight:400;opacity:.6;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.own{background:#FCE3EE;color:var(--rose)}
.chip.own[aria-pressed="true"]{background:var(--rose);color:#fff}
.desc{font-size:13px;color:var(--px);margin:10px 2px 0;min-height:1.2em}
.pick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* 목록 */
.count{color:var(--soft);font-size:13px;padding:12px 2px 2px}
h2{font:400 26px/1 var(--display);margin:24px 2px 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 13px var(--body);color:var(--soft)}
h2.own{color:var(--rose)}
ul.list{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
ul.list li{border-top:1px solid var(--line);display:flex;align-items:stretch}
ul.list li:first-child{border-top:0}
ul.list li button.cpb{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 6px 12px 16px;cursor:pointer}
ul.list li button.fav{all:unset;box-sizing:border-box;width:48px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#C9BEE6;cursor:pointer}
ul.list li button.fav[aria-pressed="true"]{color:#F2B705}
ul.list li button:hover{background:#F7F2FF}
.basket b{font-weight:700}
.st{flex:1;min-width:0}
.st .t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.st .a{color:var(--soft);font-size:13px}
.tag{font:600 11.5px/1 var(--body);padding:4px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.hot{background:#FDE7DA;color:#C2410C}.tag.prac{background:#DDF2E7;color:#1F7A55}
.cp{color:var(--soft);font-size:12px;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--soft)}
footer{color:var(--soft);font-size:12px;text-align:center;margin-top:28px}
footer button{all:unset;cursor:pointer;text-decoration:underline}

/* 위아래 이동 */
.jump{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.jump button{all:unset;width:44px;height:44px;border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 0 0 2px var(--lilac),0 3px 0 0 var(--lilac-d)}
.jump button:focus-visible{outline:3px solid var(--butter-d)}
.jump.hide{opacity:0;pointer-events:none}
/* 바구니·빙고 창 */
.panel{background:#fff;border-radius:20px;padding:18px 16px 16px;box-shadow:0 0 0 4px var(--lilac),0 0 0 8px #fff,0 0 0 11px var(--lilac-d)}
.panel h3{font:400 22px var(--display);color:var(--px);margin:0;text-align:center}
.panel .note2{font-size:12.5px;color:var(--soft);text-align:center;margin:3px 0 10px}
.favlist{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto;border:2px solid var(--line);border-radius:12px}
.favlist li{display:flex;align-items:center;border-top:1px solid var(--line)}
.favlist li:first-child{border-top:0}
.favlist button.ft{all:unset;flex:1;min-width:0;padding:10px 12px;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.favlist button.fx{all:unset;width:40px;text-align:center;color:var(--soft);cursor:pointer;font-size:18px}
.panel .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.cell{all:unset;box-sizing:border-box;position:relative;aspect-ratio:1/1;border-radius:12px;background:#F6F1FF;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:6px;font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;cursor:pointer;overflow-wrap:anywhere}
.cell.on{background:#FFF4C2;border-color:var(--butter-d)}
.cell.line{background:#FCE3EE;border-color:var(--rose)}
.cell img{position:absolute;right:4px;bottom:4px;image-rendering:pixelated;width:28px;height:24px}
.bingo-msg{text-align:center;font:400 20px var(--display);color:var(--rose);min-height:1.4em;margin-top:8px}
/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}

/* 슬롯 뽑기 */
dialog{border:0;padding:0;background:transparent;width:min(420px,calc(100% - 28px))}
dialog::backdrop{background:rgba(36,24,72,.55)}
.machine{background:#fff;border-radius:22px;padding:18px 16px 16px;text-align:center;position:relative;
  box-shadow:0 0 0 4px var(--butter-d),0 0 0 8px #fff,0 0 0 11px var(--lilac-d)}
.machine .head{font:400 22px var(--display);color:var(--px)}
.machine .scope{font-size:12.5px;color:var(--soft);margin-top:2px}
.reel{position:relative;height:150px;overflow:hidden;margin:14px 0 6px;border-radius:12px;background:linear-gradient(#EFE8FF,#fff 30%,#fff 70%,#EFE8FF);border:2px solid var(--line)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:50px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(#EFE8FF,rgba(239,232,255,0))}
.reel::after{bottom:0;background:linear-gradient(rgba(239,232,255,0),#EFE8FF)}
.reel .win{position:absolute;left:8px;right:8px;top:50px;height:50px;border:2px solid var(--butter-d);border-radius:10px;z-index:1;background:rgba(255,240,166,.35)}
.track{position:absolute;left:0;right:0;top:0;will-change:transform}
.track div{height:50px;display:flex;align-items:center;justify-content:center;padding:0 14px;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-a{color:var(--soft);font-size:13px;min-height:1.3em}
.machine .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.spark{position:absolute;image-rendering:pixelated;pointer-events:none;z-index:5}
.machine.win-glow{animation:glow .9s steps(4) 2}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--rose),0 0 0 8px #fff,0 0 0 11px var(--butter-d)}}

/* 놀이터 */
.stage{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.stage img,.strip img{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;will-change:transform;pointer-events:none}
.stage img.pet,.strip img.pet{pointer-events:auto;cursor:pointer}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.big .bubble{font-size:9px;padding:4px 6px 3px}
.bubble{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;color:var(--px);line-height:1;background:#FFFDF5;padding:6px 9px 5px;margin:2px;
  box-shadow:0 -2px 0 0 var(--px),0 2px 0 0 var(--px),-2px 0 0 0 var(--px),2px 0 0 0 var(--px),0 4px 0 0 rgba(91,69,150,.25);will-change:transform}
body.no-pets .stage, body.no-pets .strip{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.machine.win-glow{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>치비<span class="note">♪</span></h1>
    <p class="sub">곡을 누르면 제목이 복사돼요. 채팅창에 붙여서 신청하세요!</p>
    <div class="strip" id="strip"></div>
  </header>

  <section class="today" aria-label="오늘의 추천곡">
    <span class="lab">오늘의 추천곡</span>
    <div class="grow"><div class="t" id="tdT"></div><div class="a" id="tdA"></div></div>
    <button class="btn ghost" type="button" id="tdCopy">복사</button>
  </section>

  <div class="bar" id="bar">
    <div class="search"><input id="q" type="search" placeholder="제목, 가수, 초성(ㅂㄴㅂ)으로 찾기" aria-label="곡 찾기" autocomplete="off"></div>
    <div class="chips" id="chips" role="group" aria-label="분류"></div>
  </div>
  <p class="desc" id="desc"></p>
  <div class="pick">
      <button class="btn main" type="button" id="pickAll">🎰 전체에서 뽑기</button>
      <button class="btn lil" type="button" id="pickCat">이 분류에서 뽑기</button>
      <button class="btn ghost basket" type="button" id="favOpen">★ 내 바구니 <b id="favN">0</b></button>
      <button class="btn ghost" type="button" id="bingoOpen">🎯 노래 빙고</button>
      <button class="btn ghost" type="button" id="sndBtn" aria-pressed="true" aria-label="소리 켜기/끄기">🔊</button>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <main id="list"></main>
  <footer>

const ORDER = ['치비 노래','팝','가요','제이팝','뮤지컬'];
const DESC = {
  '전체':'치비가 방송에서 부른 노래와 예전 리스트를 모두 모았어요.',
  '치비 노래':'치비가 직접 만들거나 보컬로 참여한 곡',
  '가요':'한국어 노래 · 트로트, 한국어로 부른 애니곡 포함',
  '팝':'영어와 그 밖의 외국어 노래 · 재즈, 디즈니, 캐롤 포함',
  '제이팝':'일본어 노래 · 일본 애니곡 포함',
  '뮤지컬':'무대 뮤지컬에 나오는 곡',
};
const $ = id => document.getElementById(id);
const songs = SONGS.map(([c,t,a,tag,w],i)=>({i,c,t,a,tag,w:w||0}));
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s=>[...s].map(ch=>{const k=ch.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:ch}).join('');
const flat = s=>s.toLowerCase().replace(/[\s\W_]+/g,'');
songs.forEach(s=>{ s.key=flat(s.t+' '+s.a); s.ck=cho(s.t.replace(/\s/g,''))+'|'+cho(s.a.replace(/\s/g,'')); });
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = '전체';

/* ----- 복사 ----- */
let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast(`'${text}' 복사했어요`); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(`'${text}' 복사했어요`); }catch(_){ toast('복사가 안 돼요. 제목을 길게 눌러 복사해 주세요'); } ta.remove(); }
}

/* ----- 분류 버튼 ----- */
function chips(){
  const n={}; songs.forEach(s=>n[s.c]=(n[s.c]||0)+1);

function beep(f,dur,type='square',delay=0,vol=0.05,f2=null){
  if(!SND) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

  tick:()=>beep(1200,0.025,'square',0,0.03),

function spin(){
  const pool = pickScope==='전체' ? songs : songs.filter(s=>s.c===pickScope);
  if(!pool.length) return;
  spinning=true; $('machine').classList.remove('win-glow');
  picked = pool[Math.floor(Math.random()*pool.length)];
  const n=RM?1:34, seq=[];
  for(let k=0;k<n;k++) seq.push(pool[Math.floor(Math.random()*pool.length)].t);
  seq.push(picked.t, pool[Math.floor(Math.random()*pool.length)].t);
  const tr=$('track'); tr.innerHTML=['', ...seq].map(t=>`<div>${esc(t)}</div>`).join('');
  $('dArtist').textContent='';
  const H=50, end=-(seq.length-2)*H;          // 뽑힌 곡이 가운데 칸에 오도록 (맨 앞 빈 칸 포함)
  const dur=RM?1:2600, t0=performance.now(); let lastRow=0;
  (function step(now){
    const u=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-u,4);
    const y=Math.round(e*end/1)|0;
    tr.style.transform=`translateY(${y}px)`;
    const row=Math.floor(-y/H); if(row!==lastRow){ lastRow=row; if(u<1) SFX.tick(); }
    if(u<1) requestAnimationFrame(step); else { spinning=false; $('dArtist').textContent=picked.a||''; SFX.win(); celebrate(); }
  })(t0);
}

function pixelText(t){                      // 글자를 도트로 (부드러운 테두리 없이)
  if(TXC[t]) return TXC[t];
  const c=document.createElement('canvas'), g=c.getContext('2d'); g.font='700 11px sans-serif';
  const w=Math.ceil(g.measureText(t).width)+4, h=15; c.width=w; c.height=h; g.font='700 11px sans-serif'; g.textBaseline='top'; g.fillStyle='#000'; g.fillText(t,2,1);
  const im=g.getImageData(0,0,w,h), on=new Uint8Array(w*h); for(let i=0;i<w*h;i++) on[i]=im.data[i*4+3]>110;
  const o=g.createImageData(w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x, p=i*4;
    if(on[i]){ o.data[p]=217;o.data[p+1]=65;o.data[p+2]=127;o.data[p+3]=255; }
    else if((x>0&&on[i-1])||(x<w-1&&on[i+1])||(y>0&&on[i-w])||(y<h-1&&on[i+w])){ o.data[p]=255;o.data[p+1]=253;o.data[p+2]=245;o.data[p+3]=255; } }
  g.clearRect(0,0,w,h); g.putImageData(o,0,0);
  return TXC[t]={s:c.toDataURL(),w,h};
}

let PARK=null, CLOUDS=[];
function pseudo(i){ let x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function patchImg(gw,gh,mode){           // 풀밭: 도트 칸 단위로 그린 뒤 키움
  const c=document.createElement('canvas'); c.width=gw; c.height=gh; const g=c.getContext('2d');
  const put=(x,y,col)=>{ g.fillStyle=col; g.fillRect(x,y,1,1); };
  const inside=new Uint8Array(gw*gh);
  const dirt=mode==='band'?3:4, gh2=gh-dirt;
  if(mode==='band'){                    // 양 끝이 둥근 긴 풀밭
    const R=Math.min(7,Math.floor(gh2/2));
    for(let y=0;y<gh2;y++) for(let x=0;x<gw;x++){
      const top=pseudo(Math.floor(x/4))>.6?1:0; if(y<top) continue;
      const ex=x<R?R-x:(x>=gw-R?x-(gw-R-1):0), ey=Math.max(0,R-y);
      if(ex===0||ex*ex+ey*ey<=R*R*1.05) inside[y*gw+x]=1; }
  } else {                              // 울퉁불퉁한 섬
    const cx=(gw-1)/2, cy=(gh2-1)/2, rx=gw/2-2, ry=gh2/2-2, p=2.4, a1=pseudo(gw)*6, a2=pseudo(gh)*6;
    for(let y=0;y<gh2;y++) for(let x=0;x<gw;x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry, th=Math.atan2(dy,dx);
      const wob=1+0.07*Math.sin(3*th+a1)+0.05*Math.sin(5*th+a2)+0.025*Math.sin(11*th+a1*2);
      if(Math.pow(Math.abs(dx),p)+Math.pow(Math.abs(dy),p)<=Math.pow(wob,p)) inside[y*gw+x]=1; }
  }
  for(let x=0;x<gw;x++){ let yb=-1; for(let y=gh2-1;y>=0;y--) if(inside[y*gw+x]){ yb=y; break; }
    if(yb<0) continue; const d=dirt-(pseudo(x*3)>.6?1:0);
    for(let k=1;k<=d;k++) if(yb+k<gh) inside[(yb+k)*gw+x]=2; }
  const at=(x,y)=>(x<0||y<0||x>=gw||y>=gh)?0:inside[y*gw+x];
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
    const v=at(x,y); if(!v) continue;
    const edge=!at(x-1,y)||!at(x+1,y)||!at(x,y-1)||!at(x,y+1);
    if(v===2){ put(x,y, edge?'#6E4E52':(at(x,y+2)?'#C9A27E':'#AE8566')); continue; }
    if(edge){ put(x,y,'#7FB377'); continue; }
    const below=at(x,y+1)===2||at(x,y+2)===2;
    put(x,y, below?'#B3DCA0':(!at(x,y-2)?'#E4F5D8':'#CDE9B9'));
  }
  const n=Math.floor(gw*gh/80);
  for(let i=0;i<n;i++){ const x=Math.floor(pseudo(i+3)*gw), y=Math.floor(pseudo(i+99)*gh);
    if(at(x,y)!==1||at(x-1,y-1)!==1||at(x+1,y-1)!==1||at(x,y+2)!==1) continue;
    if(pseudo(i+7)<.16){ put(x,y,['#F7B6CF','#FFE68A','#C9B6F2','#FFFFFF'][i%4]); put(x,y+1,'#8CC57E'); }
    else { put(x,y,'#9CCB8A'); put(x-1,y-1,'#9CCB8A'); put(x+1,y-1,'#9CCB8A'); } }
  return c.toDataURL();
}
function prop(name,x,bottom,z,flip){

  im.style.transform=`translate(${snap(x-d.w*S/2)}px,${snap(bottom-d.h*S)}px)${flip?' scaleX(-1)':''}`; im.style.zIndex=Math.round(z);
  PARK.appendChild(im); return im;
}
function buildPark(host,wide,gutter){
  if(PARK) PARK.remove(); CLOUDS=[];
  PARK=document.createElement('div'); PARK.style.cssText='position:absolute;inset:0;pointer-events:none';
  host.insertBefore(PARK,host.firstChild);
  if(wide){
    const base=L.home('L','chibi').y;
    for(const side of ['L','R']){
      const cx=L.cx[side], m=side==='L'?1:-1, gw=Math.min(gutter*0.46,175);
      const top=base-52, bot=base+214, x0=snap(cx-gw), w=snap(2*gw), h=snap(bot-top);
      const p=document.createElement('img'); p.src=patchImg(w/S,h/S,'patch'); p.width=w; p.height=h;
      p.style.transform=`translate(${x0}px,${snap(top)}px)`; p.style.zIndex=1; PARK.appendChild(p);
      if(side==='L'){
        prop('bench',cx+m*L.sp*0.95,base-6,base-6);
        prop('lamp',cx-(gw-40),base+44,base+44);
        prop('bush',cx-gw*0.5,bot-14,bot-14);
      } else {
        prop('tree',cx+(gw-66),base+34,base+34);
        prop('bush',cx-gw*0.55,base+70,base+70,true);
        prop('bench',cx+L.sp*0.15,bot-16,bot-16,true);
      }
      for(let i=0;i<2;i++){ const c=prop('cloud',0,0,2); CLOUDS.push({el:c,x:cx-gw+pseudo(i+(side==='L'?1:5))*gw*2,y:top-110+i*44,min:Math.max(30,cx-gw+40),max:Math.min(L.w-30,cx+gw-40),v:i?0.6:1}); }
    }
  } else {
    const sw=L.w, h=40, bw=snap(sw-8);
    const p=document.createElement('img'); p.src=patchImg(bw/S,h/S,'band'); p.width=bw; p.height=h;
    p.style.transform=`translate(4px,${158-h}px)`; p.style.zIndex=1; PARK.appendChild(p);
    prop('lamp',22,134,20); prop('bench',sw*0.2,132,20); prop('bush',sw*0.66,140,20,true); prop('tree',sw-50,134,20);
    for(let i=0;i<2;i++){ const c=prop('cloud',0,0,2); CLOUDS.push({el:c,x:pseudo(i+2)*sw,y:14+i*22,min:-60,max:sw+60,v:i?0.6:1}); }
  }

}
function drawClouds(){ for(const c of CLOUDS){ const d=BG.cloud; c.el.style.transform=`translate(${snap(c.x-d.w*S/2)}px,${snap(c.y)}px)`; } }

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const Ez={io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3)};
const seg=(t,a,b,f='io')=>Ez[f](clamp((t-a)/(b-a),0,1));
const step=(t,per)=>Math.floor(t/per);

    else if(t<9.2) p={...near,key:'happy',face:land.x>=near.x?1:-1,bob:hopPx(t-7.8+ph*.3,4,0.6)};
    else if(t<10.6){const u=seg(t,9.2+s*0.5,10.4+s*0.5);p={x:lerp(near.x,hO.x,u),y:lerp(near.y,hO.y,u),key:u>0&&u<1?(step(t,0.2)%2?'run1':'stand'):'stand',face:hO.x>=near.x?1:-1,bob:u>0&&u<1?hopPx(t,1,0.2,ph):0};}
    else p={...hO,key:['stand','tailA','stand','tailB'][step(t+ph,0.3)%4],face:-dir};
    out[r]=p;
  }
  return {out,say};
}
function frameAt(T){const k=Math.floor(T/LOOP),t=T-k*LOOP,H=k%2?'R':'L';return t<REST?restFrame(t,H,k):chaseFrame(t-REST,H);}
let lastSay='';
function draw(T){
  if(!L) return;
  const fr=frameAt(T), out=fr.out;
  for(const r of ROLES){
    const a=A[r], set=PX.F[r]; let s=out[r];
    const pk=POKE[r], age=pk?(performance.now()-pk.t0)/1000:9;
    if(age<1.4) s={...s, key:r==='chibi'?'cheer':'happy', bob:hopPx(age,r==='chibi'?8:4,0.45), fx:{k:r==='chibi'?'note':'heart',t:(age%0.7)/0.7}};
    const d=set[s.key]||set[r==='chibi'?'idle':'stand'];
    setImg(a.sp,d,a,'key',r+s.key);
    const w=d.w*S, h=d.h*S, bob=(s.bob||0)*S;
    const x=clamp(snap(s.x-w/2+(s.sway||0)*S),2,L.w-w-2), y=snap(s.y-h)-bob;
    a.sp.style.transform=`translate(${x}px,${y}px) scaleX(${s.face<0?-1:1})`; a.sp.style.zIndex=Math.round(s.y)+10;
    const big=r==='chibi'?'chibi':'cat', shk=(s.bob||0)>5?big+'S':big, sd=PX.SH[shk];
    setImg(a.sh,sd,a,'shk',shk);
    a.sh.style.transform=`translate(${snap(x+w/2-sd.w*S/2)}px,${snap(s.y-sd.h*S+2)}px)`; a.sh.style.zIndex=Math.round(s.y);
    if(s.fx){
      const fd=PX.FX[s.fx.k]; setImg(a.fx,fd,a,'fxk',s.fx.k);
      const rise=Math.floor(s.fx.t*6)*S, side=s.face<0?-1:1, nh=r==='chibi'&&(s.fx.k==='note'||s.fx.k==='note2');
      const fx_=nh?snap(x+(side>0?w+2:-fd.w*S-2)):snap(x+(side<0?w*0.25:w*0.68)-fd.w*S/2);
      const fy=(nh?snap(y+h*0.25):snap(y-fd.h*S-2))-rise;
      a.fx.style.display='block'; a.fx.style.opacity=s.fx.t>.8?.4:s.fx.t>.6?.7:1;
      a.fx.style.transform=`translate(${fx_}px,${fy}px)`; a.fx.style.zIndex=9000;
    } else a.fx.style.display='none';
    if(age<1.4){                                  // 누른 친구 머리 위 도트 글씨
      const td=pixelText(pk.txt); setImg(a.tx,td,a,'txk',pk.txt);
      a.tx.style.display='block'; a.tx.style.opacity=age>1.1?.5:1;
      a.tx.style.transform=`translate(${snap(x+w/2-td.w*S/2)}px,${snap(y-td.h*S-14)-Math.floor(age*5)*S}px)`; a.tx.style.zIndex=9500;
    } else a.tx.style.display='none';
  }
  const c=out.chibi, cd=PX.F.chibi[c.key]||PX.F.chibi.idle;
  if(fr.say!==lastSay){bubble.textContent=fr.say; lastSay=fr.say;}
  const bw=bubble.offsetWidth||100;
  bubble.style.transform=`translate(${clamp(snap(c.x-bw/2),4,L.w-bw-6)}px,${Math.max(2,snap(c.y-cd.h*S-(c.bob||0)*S-(L.wide?40:34)))}px)`;
  bubble.style.zIndex=9999; bubble.style.display='block';
}
let T=0, playing=!RM, last=null;
function tick(now){ if(last!==null&&playing) T+=Math.min((now-last)/1000,0.05); last=now; draw(T); requestAnimationFrame(tick); }
function setPets(on){ document.body.classList.toggle('no-pets',!on); $('petToggle').textContent=on?'놀고 있는 친구들 숨기기':'친구들 다시 부르기'; try{localStorage.setItem('chivee-pets',on?'1':'0');}catch(e){} }
let petsOn=true; try{ petsOn=localStorage.getItem('chivee-pets')!=='0'; }catch(e){}
setPets(petsOn);
$('petToggle').onclick=()=>{ petsOn=!petsOn; setPets(petsOn); };
addEventListener('resize',layout);
layout(); requestAnimationFrame(tick);
</script>
</body>
