<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{

  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16142A; --sheet:#201D38; --ink:#EDEBFA; --soft:#A6A2C4; --line:#33304F;
  --cobalt:#8C99FF; --rose:#FF7EB0; --rose-bg:#3A2140; --hot:#FF9A62; --hot-bg:#3A2522; --prac:#6FD3A3; --prac-bg:#1D3A30; --chip:#2C2948;}}
:root[data-theme="dark"]{
  --paper:#16142A; --sheet:#201D38; --ink:#EDEBFA; --soft:#A6A2C4; --line:#33304F;
  --cobalt:#8C99FF; --rose:#FF7EB0; --rose-bg:#3A2140; --hot:#FF9A62; --hot-bg:#3A2522; --prac:#6FD3A3; --prac-bg:#1D3A30; --chip:#2C2948;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.top{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 clamp(44px,11vw,72px)/0.9 var(--display);margin:0;letter-spacing:-0.01em}
h1 .note{color:var(--rose)}
.sub{color:var(--soft);margin:8px 0 0;font-size:14px}
.pick{font:400 20px/1 var(--display);background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 22px;cursor:pointer}
.pick:hover{background:var(--cobalt)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--cobalt)}
.search select{font:inherit;font-size:14px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 14px/1 var(--body);padding:8px 12px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip b{font-weight:400;color:var(--soft);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.chip.own{background:var(--rose-bg);color:var(--rose)}
.chip.own[aria-pressed="true"]{background:var(--rose);color:#fff}
.count{color:var(--soft);font-size:13px;padding:10px 2px 4px}
h2{font:400 26px/1 var(--display);margin:26px 0 6px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 13px var(--body);color:var(--soft)}
h2.own{color:var(--rose)}
ul{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:14px;overflow:hidden}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;cursor:pointer}
li button:hover{background:var(--chip)}
li button:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}
.t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.a{color:var(--soft);font-size:13.5px;grid-column:1}
.meta{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:12.5px;color:var(--soft);white-space:nowrap}
.meta .n{display:block;font-weight:600;color:var(--ink);font-size:13px}
.tag{display:inline-block;font:600 11.5px/1 var(--body);padding:4px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.hot{background:var(--hot-bg);color:var(--hot)} .tag.prac{background:var(--prac-bg);color:var(--prac)}
.tag.new{background:var(--cobalt);color:#fff} .tag.ver{background:var(--chip);color:var(--soft)}
.empty{padding:40px 16px;text-align:center;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:0;border-radius:20px;padding:0;background:var(--sheet);color:var(--ink);width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgba(20,16,40,.55)}
.ticket{padding:26px 24px 20px;text-align:center}
.ticket .g{font-size:13px;color:var(--soft)}
.ticket .tt{font:400 34px/1.1 var(--display);margin:10px 0 6px;overflow-wrap:anywhere}
.ticket .aa{color:var(--soft)}
.ticket .row{display:flex;gap:8px;margin-top:22px}
.ticket .row button{flex:1;font:500 15px var(--body);padding:12px;border-radius:12px;border:0;cursor:pointer}
.ticket .again{background:var(--chip);color:var(--ink)} .ticket .copy{background:var(--cobalt);color:#fff}
.ticket .close{background:none;border:0;color:var(--soft);font:inherit;margin-top:12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>치비<span class="note">♪</span></h1>
      <p class="sub">신청할 곡을 누르면 제목이 복사돼요</p>
    </div>
    <button class="pick" id="pick" type="button">아무 곡이나 뽑기</button>
  </header>
  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="제목, 가수, 초성(ㅂㄴㅂ)으로 찾기" aria-label="곡 찾기" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="name">가나다순</option>
        <option value="many">많이 부른 순</option>
        <option value="recent">최근 부른 순</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="장르"></div>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <main id="list"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg">
  <div class="ticket">
    <div class="g" id="dg"></div>
    <div class="tt" id="dt"></div>
    <div class="aa" id="da"></div>
    <div class="row"><button class="again" id="again" type="button">다시 뽑기</button><button class="copy" id="dcopy" type="button">제목 복사</button></div>
    <button class="close" id="dclose" type="button">닫기</button>
  </div>
</dialog>

  try{await navigator.clipboard.writeText(text);toast(`'${text}' 복사했어요`)}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(`'${text}' 복사했어요`)}catch(_){toast('복사가 안 돼요. 제목을 길게 눌러 복사해 주세요')}ta.remove()}
}
let cur=null;
function draw(){const l=filtered();if(!l.length){toast('뽑을 곡이 없어요');return}
  cur=l[Math.floor(Math.random()*l.length)];
  $('dg').textContent=cur.g+(cur.n?` · ${cur.n}번 부름`:'');$('dt').textContent=cur.t;$('da').textContent=cur.a||'';
  if(!$('dlg').open)$('dlg').showModal();}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const g=b.dataset.g;
  if(g.startsWith('#')){tagF=g.slice(1);genre='전체'}else{tagF='';genre=g}chips();render();});
$('q').addEventListener('input',render);$('sort').addEventListener('change',render);
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)copy(songs[+b.dataset.i])});
$('pick').addEventListener('click',draw);$('again').addEventListener('click',draw);
$('dcopy').addEventListener('click',()=>cur&&copy(cur));$('dclose').addEventListener('click',()=>$('dlg').close());
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
chips();render();
</script>
</body>
</html>
